<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扶搖江湖・3D 試作品</title>
    <style>
      @font-face {
        font-family: 'Cubic11';
        src: url('/fonts/Cubic_11.woff2') format('woff2');
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #141a2e; font-family: Cubic11, sans-serif; }
      canvas { display: block; }
      .p-labels { position: fixed; inset: 0; pointer-events: none; }
      .p-label { color: #fff; font-size: 13px; padding: 1px 6px; background: rgba(20, 16, 28, 0.55); border-radius: 3px; white-space: nowrap; }
      .p-locked { color: #b8b8b8; }
      .p-name { color: #fffbe8; font-size: 11px; text-shadow: 0 1px 2px #000, 0 0 3px #000; white-space: nowrap; }
      .p-dmg { color: #ffe080; font-size: 18px; text-shadow: 0 2px 0 #6a1a14, 0 0 4px #000; white-space: nowrap; }
      .p-hp { width: 64px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; text-align: center; }
      .p-hp i { display: block; height: 4px; margin-top: 2px; background: #5ad06a; border: 1px solid #1a1a1a; transition: width 0.3s; }
      .p-hp.foe i { background: #e85a4a; }
      .p-hint { color: #17141f; background: #f0c860; font-size: 12px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; box-shadow: 0 1px 0 #6a4a1a; }
      #p-ui { position: fixed; inset: 0; pointer-events: none; }
      .p-dialog { position: absolute; left: 50%; transform: translateX(-50%); width: min(720px, 80vw); bottom: 76px; background: rgba(23, 20, 31, 0.93); border: 2px solid #c9a46a; border-radius: 6px; color: #f4ead6; padding: 14px 18px 18px; font-size: 18px; line-height: 1.6; box-shadow: 0 4px 0 rgba(0,0,0,0.35); }
      .p-speaker { position: absolute; top: -16px; left: 14px; background: #c9a46a; color: #17141f; padding: 2px 12px; font-size: 15px; border-radius: 3px; }
      .p-more { position: absolute; right: 12px; bottom: 6px; color: #f0c860; font-size: 12px; animation: p-blink 0.9s infinite; }
      @keyframes p-blink { 50% { opacity: 0.2; } }
      .p-choices { list-style: none; margin: 10px 0 0; padding: 0; }
      .p-choices li { padding: 2px 8px; color: #c8bca4; }
      .p-choices li.on { color: #fff; background: rgba(201, 164, 106, 0.25); }
      .p-shop { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, 92vw); background: #f2e8d2; color: #2a2018; border: 3px solid #6a4a2a; border-radius: 6px; padding: 14px 18px; font-size: 16px; box-shadow: 0 6px 0 rgba(0,0,0,0.35); }
      .p-shop-head { display: flex; justify-content: space-between; border-bottom: 2px solid #c9a46a; padding-bottom: 6px; }
      .p-shop-head b { color: #8a2e26; font-weight: normal; font-size: 19px; }
      .p-tabs { margin: 8px 0; display: flex; gap: 8px; align-items: center; }
      .p-tabs span { padding: 1px 12px; border: 1px solid #a88a5a; color: #8a7a5a; }
      .p-tabs span.on { background: #6a4a2a; color: #f2e8d2; }
      .p-tabs small { margin-left: auto; color: #9a8a6a; font-size: 12px; }
      .p-goods { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow: auto; }
      .p-goods li { display: flex; justify-content: space-between; padding: 3px 8px; border-bottom: 1px dashed #d8c8a8; }
      .p-goods li.on { background: #e2d2ae; }
      .p-goods li small { color: #8a7a5a; }
      .p-goods li.muted { color: #9a8a6a; }
      .p-desc { min-height: 40px; margin-top: 8px; font-size: 13px; color: #5a4a3a; }
      .p-note { margin-top: 6px; font-size: 13px; color: #8a2e26; }
      #panel { position: fixed; top: 12px; left: 12px; background: rgba(23, 20, 31, 0.86); color: #f0e6d0; padding: 10px 12px; border: 2px solid #c9a46a; border-radius: 4px; font-size: 13px; }
      #panel h1 { font-size: 15px; margin: 0 0 8px; color: #f0c860; font-weight: normal; }
      #panel .row { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
      #panel b { width: 34px; font-weight: normal; color: #b8a888; }
      #panel button { font: inherit; font-size: 12px; background: #2e2838; color: #e8dcc0; border: 1px solid #5a4e40; padding: 2px 7px; cursor: pointer; }
      #panel button.on { background: #c9a46a; color: #17141f; border-color: #f0c860; }
      #panel .keys { margin: 8px 0 0; font-size: 11px; color: #a89878; line-height: 1.6; }
      #info { position: fixed; left: 12px; bottom: 12px; color: #fff; background: rgba(23, 20, 31, 0.75); padding: 6px 10px; font-size: 13px; white-space: pre-line; border-radius: 3px; max-width: 70vw; }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <div id="info"></div>
    <script type="module" src="/src/proto/main.ts"></script>
  </body>
</html>
